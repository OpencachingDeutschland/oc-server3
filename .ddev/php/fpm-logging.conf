[www]
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php-fpm.log
php_admin_flag[log_errors] = on
; php_admin_value cannot be overridden by ini_set() at runtime.
; 22527 = E_ALL & ~E_DEPRECATED — suppresses PHP 8.4 vendor deprecation spam
; that would otherwise corrupt HTML output before headers are sent.
php_admin_value[error_reporting] = 22527
