---
# opencaching.de test system — full provisioning playbook
# Targets: Debian 12 (bookworm), bare-metal Apache + PHP-FPM + MariaDB server
#
# GOAL: After running this playbook on a fresh VM, both applications are fully functional:
#   - oc3 (legacy app): Homepage and login working on PHP 8.2
#   - oc4 (Symfony app): Login page working on PHP 8.4
#
# DATABASE STRATEGY: Schema and seed data from repository code, not external dumps
#   - Phase 3: Create empty database, run migrations, load static data, create stored procedures
#   - Phase 7: Verify setup with post-install scripts
#   - This ensures reproducibility and avoids trigger definer issues

- name: Provision opencaching.de test system
  hosts: oc_test
  become: true
  vars_files:
    - vars/main.yml
  vars:
    # These two are the only things that change between test and prod:
    # oc3_domain: "oc3.example.de"
    # oc4_domain: "oc4.example.de"

  tasks:

    # ── Phase 1: Base System ───────────────────────────────────────────

    - name: Update and upgrade system packages
      apt:
        update_cache: yes
        upgrade: safe
        cache_valid_time: 3600

    - name: Add sury.org repo for PHP 8.2 (not in Debian 13)
      shell: |
        apt-get install -y apt-transport-https lsb-release ca-certificates curl
        curl -sSLo /usr/share/keyrings/deb.sury.org-php.gpg https://packages.sury.org/php/apt.gpg
        echo "deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ $(lsb_release -sc) main" > /etc/apt/sources.list.d/php.list
        apt-get update
      args:
        creates: /etc/apt/sources.list.d/php.list

    - name: Install base packages (system)
      apt:
        name:
          - apache2
          - mariadb-client
          - mariadb-server
          - git
          - composer
          - redis-server
          - memcached
          - unzip
          - curl
          - ca-certificates
          - sudo
          - rsync
        state: present

    - name: Install PHP packages (both 8.2 and 8.4)
      apt:
        name:
          - php{{ item }}
          - php{{ item }}-cli
          - php{{ item }}-fpm
          - php{{ item }}-gd
          - php{{ item }}-imagick
          - php{{ item }}-intl
          - php{{ item }}-mbstring
          - php{{ item }}-mysql
          - php{{ item }}-curl
          - php{{ item }}-apcu
          - php{{ item }}-redis
          - php{{ item }}-memcached
          - php{{ item }}-soap
          - php{{ item }}-bcmath
          - php{{ item }}-ldap
          - php{{ item }}-igbinary
          - php{{ item }}-msgpack
          - php{{ item }}-xml
          - php{{ item }}-zip
        state: present
      loop:
        - "8.2"
        - "8.4"

    - name: Enable Apache modules
      apache2_module:
        name: "{{ item }}"
        state: present
      loop:
        - rewrite
        - proxy
        - proxy_fcgi
        - headers
        - expires
        - ssl
        - deflate
        - mime
        - env
        - setenvif

    - name: Disable mod_php (we use PHP-FPM)
      apache2_module:
        name: php{{ php_version }}
        state: absent
      ignore_errors: true

    - name: Enable PHP-FPM config in Apache
      command: a2enconf php{{ php_version }}-fpm
      args:
        creates: /etc/apache2/conf-enabled/php{{ php_version }}-fpm.conf

    - name: Increase Apache request field size (large cookie headers)
      lineinfile:
        path: /etc/apache2/apache2.conf
        line: "LimitRequestFieldSize 16380"
        insertafter: EOF

    - name: SECURITY - Configure Apache security directives
      lineinfile:
        path: /etc/apache2/apache2.conf
        line: "{{ item }}"
        insertafter: EOF
      loop:
        - "ServerTokens Prod"
        - "ServerSignature Off"
        - "FileETag None"

    - name: Copy SSH deploy keys for GitHub repos
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - src: "files/oc_testsystem_deploy"
          dest: /root/.ssh/id_ed25519_oc_deploy
        - src: "files/oc_testsystem_okapi"
          dest: /root/.ssh/id_ed25519_okapi_deploy

    - name: Configure SSH for GitHub (multi-key)
      copy:
        content: |
          Host github.com
            HostName github.com
            IdentityFile /root/.ssh/id_ed25519_oc_deploy
            IdentityFile /root/.ssh/id_ed25519_okapi_deploy
            IdentitiesOnly yes
            User git
        dest: /root/.ssh/config
        owner: root
        group: root
        mode: "0644"

    - name: Create PHP include directory
      file:
        path: /usr/local/lib/php
        state: directory
        mode: "0755"

    - name: Deploy E_STRICT deprecation warning stripper
      copy:
        content: |
          <?php
          ob_start(function($buffer) {
              return preg_replace('/Deprecated: Constant E_STRICT is deprecated[^\n]*\n/', '', $buffer);
          });
        dest: /usr/local/lib/php/strip-e-strict.php
        mode: "0644"

    - name: Configure PHP-FPM for both PHP versions
      copy:
        content: |
          ; OpenCaching PHP compatibility
          display_errors = Off
          display_startup_errors = Off
          log_errors = On
          error_reporting = 30719
          auto_prepend_file = /usr/local/lib/php/strip-e-strict.php
        dest: "/etc/php/{{ item }}/fpm/conf.d/99-openaching.ini"
        owner: root
        group: root
        mode: "0644"
      loop:
        - "8.2"
        - "8.4"
      notify: reload php-fpm

    - name: Deploy PHP 8.2 FPM pool for legacy app
      copy:
        content: |
          [legacy]
          user = {{ web_user }}
          group = {{ web_group }}
          listen = /run/php/php8.2-legacy.sock
          listen.owner = {{ web_user }}
          listen.group = {{ web_group }}
          listen.mode = 0660
          pm = dynamic
          pm.max_children = 20
          pm.start_servers = 3
          pm.min_spare_servers = 2
          pm.max_spare_servers = 5
          php_value[error_reporting] = 30719
          php_flag[display_errors] = off
          clear_env = no
          env[OC_DB_USER] = "{{ db_user }}"
          env[OC_DB_PASS] = "{{ db_pass }}"
        dest: /etc/php/8.2/fpm/pool.d/legacy.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart php8.2-fpm

    - name: Deploy PHP 8.4 FPM pool for Symfony app
      copy:
        content: |
          [symfony]
          user = {{ web_user }}
          group = {{ web_group }}
          listen = /run/php/php8.4-symfony.sock
          listen.owner = {{ web_user }}
          listen.group = {{ web_group }}
          listen.mode = 0660
          pm = dynamic
          pm.max_children = 20
          pm.start_servers = 3
          pm.min_spare_servers = 2
          pm.max_spare_servers = 5
          php_value[error_reporting] = 30719
          php_flag[display_errors] = off
          clear_env = no
          env[OC_DB_USER] = "{{ db_user }}"
          env[OC_DB_PASS] = "{{ db_pass }}"
          env[APP_ENV] = "prod"
          env[APP_DEBUG] = "0"
        dest: /etc/php/8.4/fpm/pool.d/symfony.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart php8.4-fpm

    - name: SECURITY - Configure PHP security settings
      copy:
        content: |
          ; Security hardening for production-like environment
          expose_php = Off
          allow_url_fopen = Off
          ; Error handling
          display_errors = On
          display_startup_errors = Off
          log_errors = On
          error_log = /var/log/php/error-8.2.log
          ; Session security
          session.cookie_httponly = 1
          session.cookie_secure = 1
          session.cookie_samesite = "Lax"
          session.gc_maxlifetime = 3600
        dest: /etc/php/8.2/fpm/conf.d/99-security.ini
        owner: root
        group: root
        mode: "0644"
      notify: restart php8.2-fpm

    - name: SECURITY - Configure PHP 8.4 security settings
      copy:
        content: |
          ; Security hardening for production-like environment
          expose_php = Off
          allow_url_fopen = Off
          ; Error handling
          display_errors = On
          display_startup_errors = Off
          log_errors = On
          error_log = /var/log/php/error-8.4.log
          ; Session security
          session.cookie_httponly = 1
          session.cookie_secure = 1
          session.cookie_samesite = "Lax"
          session.gc_maxlifetime = 3600
        dest: /etc/php/8.4/fpm/conf.d/99-security.ini
        owner: root
        group: root
        mode: "0644"
      notify: restart php8.4-fpm

    - name: SECURITY - Create PHP error log directory
      file:
        path: /var/log/php
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: SECURITY - Configure log rotation for PHP error logs
      copy:
        content: |
          /var/log/php/*.log {
              daily
              rotate 14
              missingok
              notifempty
              compress
              delaycompress
              postrotate
                  systemctl reload php8.2-fpm php8.4-fpm > /dev/null 2>&1 || true
              endscript
          }
        dest: /etc/logrotate.d/php-fpm
        owner: root
        group: root
        mode: "0644"

    - name: SECURITY - Configure log rotation for Apache access/error logs
      copy:
        content: |
          /var/log/apache2/*.log {
              daily
              rotate 30
              missingok
              notifempty
              compress
              delaycompress
              sharedscripts
              postrotate
                  systemctl reload apache2 > /dev/null 2>&1 || true
              endscript
          }
        dest: /etc/logrotate.d/apache2-custom
        owner: root
        group: root
        mode: "0644"

    - name: Flush handlers (apply PHP-FPM changes now)
      meta: flush_handlers

    - name: SECURITY - Install mod_evasive for rate limiting
      apt:
        name: libapache2-mod-evasive
        state: present

    - name: SECURITY - Enable mod_evasive
      apache2_module:
        name: evasive
        state: present
      ignore_errors: true

    - name: SECURITY - Configure mod_evasive for brute-force protection
      copy:
        content: |
          <IfModule mod_evasive20.c>
              DOSHashTableSize 3097
              DOSPageCount 2
              DOSSiteCount 20
              DOSPageInterval 1
              DOSSiteInterval 1
              DOSBlockingPeriod 600
              DOSEmailNotify admin@example.com
              DOSSystemCommand "logger -t mod_evasive '%s' &"
          </IfModule>
        dest: /etc/apache2/mods-enabled/evasive.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart apache2

    - name: SECURITY - Create Apache rate limiting config for auth endpoints
      copy:
        content: |
          # SECURITY: Stricter limits on login and API authentication endpoints
          <LocationMatch "^/(security/login|okapi/services/caches/create|okapi/services/caches/update|okapi/services/caches/delete)">
              <IfModule mod_evasive20.c>
                  DOSPageCount 5
                  DOSPageInterval 60
              </IfModule>
          </LocationMatch>
        dest: /etc/apache2/conf-available/security-rate-limits.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart apache2

    - name: SECURITY - Enable rate limiting config
      command: a2enconf security-rate-limits.conf
      args:
        creates: /etc/apache2/conf-enabled/security-rate-limits.conf
      notify: restart apache2

    - name: Start and enable services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - apache2
        - php8.2-fpm
        - php8.4-fpm
        - redis-server
        - memcached

    # ── Phase 2: Directory Layout ──────────────────────────────────────

    - name: Create web root
      file:
        path: "{{ web_root }}"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0755"

    - name: Configure git safe directory (for mixed ownership)
      command: git config --global --add safe.directory "{{ app_root }}"

    - name: Clone repository
      git:
        repo: "{{ git_repo }}"
        dest: "{{ app_root }}"
        version: "{{ git_branch }}"
        accept_hostkey: true
        key_file: /root/.ssh/id_ed25519_oc_deploy
        force: yes

    - name: Fix repository ownership
      file:
        path: "{{ app_root }}"
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        recurse: yes

    - name: "Clone OKAPI fork directly into htdocs/okapi (preserves .git for daily git pull)"
      shell: |
        rm -rf {{ app_root }}/htdocs/okapi
        GIT_SSH_COMMAND='ssh -i /root/.ssh/id_ed25519_okapi_deploy -o StrictHostKeyChecking=no' git clone --branch {{ okapi_branch }} {{ okapi_repo }} {{ app_root }}/htdocs/okapi
        cd {{ app_root }}/htdocs/okapi
        # Move okapi/ subdirectory contents up one level
        for f in okapi/* okapi/.[!.]*; do
          [ -e "$f" ] || continue
          mv "$f" ./
        done 2>/dev/null
        rmdir okapi 2>/dev/null || true
        # Fix autoload — code is now at root, not in okapi/ subdir
        sed -i 's|"okapi\\\\": "okapi/"|"okapi\\\\": "."|' composer.json

    - name: Install OKAPI composer dependencies
      shell: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction --no-progress
      args:
        chdir: "{{ app_root }}/htdocs/okapi"

    - name: Fix OKAPI ownership
      file:
        path: "{{ app_root }}/htdocs/okapi"
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        recurse: yes

    # ── Phase 3: Database ──────────────────────────────────────────────

    - name: Configure MariaDB sql_mode for legacy code compatibility (disable STRICT_TRANS_TABLES)
      lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: "^sql_mode"
        line: "sql_mode = ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION"
        insertafter: '\[mysqld\]'
        state: present
      notify: restart mariadb

    - name: Install Python MySQL module
      apt:
        name: python3-pymysql
        state: present

    - name: Create database
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: db_local is defined and (db_local | bool)

    - name: SECURITY - Create database user (app — read/write + stored proc management)
      mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        # SECURITY: Application user has SELECT, INSERT, UPDATE, DELETE, LOCK TABLES, EXECUTE
        # Plus ALTER ROUTINE for maintain.php to rebuild stored procedures/triggers
        # Excludes: CREATE, DROP (table-level), GRANT
        priv: "{{ db_name }}.*:SELECT,INSERT,UPDATE,DELETE,CREATE,CREATE ROUTINE,ALTER ROUTINE,CREATE TEMPORARY TABLES,TRIGGER,LOCK TABLES,EXECUTE"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: db_local is defined and (db_local | bool)

    - name: SECURITY - Create database admin user (migrations and triggers only)
      mysql_user:
        name: "{{ db_admin_user }}"
        password: "{{ db_admin_pass }}"
        # SECURITY: Admin user for schema changes and trigger management (used during deploy only)
        # Created but NOT used by running application
        priv: "{{ db_name }}.*:SELECT,INSERT,UPDATE,DELETE,CREATE,DROP,INDEX,ALTER,CREATE ROUTINE,ALTER ROUTINE,TRIGGER,LOCK TABLES"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: db_local is defined and (db_local | bool)

    - name: SECURITY - Save database credentials to secure file (admin review)
      copy:
        content: |
          # PRODUCTION-READY DATABASE CREDENTIALS
          # Generated: {{ ansible_date_time.iso8601 }}
          # WARNING: Store these securely. Delete after reviewing in application config.

          App User (used by application):
            Username: {{ db_user }}
            Password: {{ db_pass }}
            Privileges: SELECT,INSERT,UPDATE,DELETE,LOCK TABLES,EXECUTE

          Admin User (used for migrations only):
            Username: {{ db_admin_user }}
            Password: {{ db_admin_pass }}
            Privileges: Full (for schema changes)

          # Keep this file private:
          # chmod 600 /root/.oc-credentials
        dest: /root/.oc-credentials
        owner: root
        group: root
        mode: "0600"
      when: db_local is defined and (db_local | bool)

    # Database foundation: dump_v158.sql provides complete base schema
    # Triggers/stored procs from dump have root@localhost definer;
    # maintain.php in Phase 7 will replace them with correct definer.

    - name: Import base schema dump (needs root for DEFINER clauses)
      shell: |
        mysql -u root -e "DROP DATABASE IF EXISTS {{ db_name }}; CREATE DATABASE {{ db_name }}; GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,DROP,INDEX,ALTER ON {{ db_name }}.* TO '{{ db_user }}'@'localhost'" 2>/dev/null
        mysql -u root --force {{ db_name }} < {{ app_root }}/sql/dump_v158.sql 2>&1 || true
      args:
        executable: /bin/bash
      when: db_local is defined and (db_local | bool)

    # ── Phase 4: Legacy App (oc3) Config ───────────────────────────────

    - name: Switch smarty repo from SSH to HTTPS (public, no auth needed)
      shell: COMPOSER_ALLOW_SUPERUSER=1 composer config repositories.smarty vcs https://github.com/OpencachingDeutschland/smarty
      args:
        chdir: "{{ app_root }}/htdocs"

    - name: Composer install — legacy app
      shell: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction --no-progress
      args:
        chdir: "{{ app_root }}/htdocs"
      async: 300
      poll: 10

    - name: Deploy legacy settings.inc.php
      template:
        src: templates/settings.inc.php.j2
        dest: "{{ app_root }}/htdocs/config2/settings.inc.php"
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"

    - name: Deploy legacy parameters.yml
      template:
        src: templates/parameters.yml.j2
        dest: "{{ app_root }}/htdocs/app/config/parameters.yml"
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"

    # ── Phase 5: Symfony App (oc4) Config ──────────────────────────────

    - name: Deploy Symfony .env.local
      template:
        src: templates/env.local.j2
        dest: "{{ app_root }}/htdocs_symfony/.env.local"
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"

    - name: Clear Symfony cache before composer install (avoid stale container)
      file:
        path: "{{ app_root }}/htdocs_symfony/var/cache"
        state: absent
      ignore_errors: true

    - name: Composer install — symfony app (no post-install scripts)
      shell: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction --no-progress --no-scripts
      args:
        chdir: "{{ app_root }}/htdocs_symfony"
      async: 300
      poll: 10

    - name: Run Symfony post-install scripts (after cache is cleared)
      shell: COMPOSER_ALLOW_SUPERUSER=1 composer run-script post-install-cmd
      args:
        chdir: "{{ app_root }}/htdocs_symfony"
      ignore_errors: true

    - name: Inject Symfony domain meta tag into legacy template
      lineinfile:
        path: "{{ app_root }}/htdocs/templates2/ocstyle/sys_main.tpl"
        insertafter: '<link rel="SHORTCUT ICON"'
        line: '    <meta name="symfony-domain" content="{{ oc4_domain }}">'

    - name: Deploy Tabulator base theme CSS
      copy:
        src: files/tabulator.min.css
        dest: "{{ app_root }}/htdocs_symfony/public/vendor/tabulator/tabulator.min.css"
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"

    # ── Phase 5b: Self-signed SSL Certs (test system only) ──────────────

    - name: Create letsencrypt directory structure
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "/etc/letsencrypt/live/{{ oc3_domain }}"
        - "/etc/letsencrypt/live/{{ oc4_domain }}"

    - name: Generate self-signed certificate with SAN
      command: |
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout "/etc/letsencrypt/live/{{ oc3_domain }}/privkey.pem" \
          -out "/etc/letsencrypt/live/{{ oc3_domain }}/fullchain.pem" \
          -subj "/CN={{ oc3_domain }}" \
          -addext "subjectAltName=DNS:{{ oc3_domain }},DNS:{{ oc4_domain }}"
      args:
        creates: "/etc/letsencrypt/live/{{ oc3_domain }}/fullchain.pem"

    - name: Link oc4 certs to oc3 (both domains on same cert)
      file:
        src: "/etc/letsencrypt/live/{{ oc3_domain }}/{{ item }}"
        dest: "/etc/letsencrypt/live/{{ oc4_domain }}/{{ item }}"
        state: link
        force: yes
      loop:
        - fullchain.pem
        - privkey.pem

    # ── Phase 6: Apache Vhosts ─────────────────────────────────────────

    - name: Deploy oc3 vhost
      template:
        src: templates/oc3-vhost.conf.j2
        dest: "/etc/apache2/sites-available/{{ oc3_domain }}.conf"
      notify: reload apache

    - name: Deploy oc4 vhost
      template:
        src: templates/oc4-vhost.conf.j2
        dest: "/etc/apache2/sites-available/{{ oc4_domain }}.conf"
      notify: reload apache

    - name: Enable vhosts
      command: a2ensite "{{ item }}"
      args:
        creates: "/etc/apache2/sites-enabled/{{ item }}.conf"
      loop:
        - "{{ oc3_domain }}"
        - "{{ oc4_domain }}"
      notify: reload apache

    - name: Disable default vhost
      command: a2dissite 000-default
      args:
        removes: /etc/apache2/sites-enabled/000-default.conf
      ignore_errors: true
      notify: reload apache

    - name: Flush handlers (apply Apache and FPM configs now)
      meta: flush_handlers

    # ── Phase 7: Post-install Scripts ──────────────────────────────────
    # Order mirrors init.sh: OKAPI install → dbsv-update → static data →
    # maintain → migrations → OKAPI update → security roles

    - name: Install OKAPI (requires app to be running)
      uri:
        url: "https://{{ oc3_domain }}/okapi/update?install=true"
        validate_certs: false
      when: db_local is defined and (db_local | bool)
      register: okapi_install
      until: okapi_install.status == 200
      retries: 10
      delay: 5

    - name: Create OKAPI meta.php (install doesn't write it in fork)
      copy:
        content: |
          <?php
          return [
              'version_number' => 127,
              'git_revision' => '{{ okapi_branch }}',
              'version_name' => 'OKAPI r127 ({{ okapi_branch }})',
          ];
        dest: "{{ app_root }}/htdocs/okapi/meta.php"
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
      when: db_local is defined and (db_local | bool)

    - name: Run dbsv-update.php (schema patches after OKAPI)
      command: php bin/dbsv-update.php
      args:
        chdir: "{{ app_root }}"
      when: db_local is defined and (db_local | bool)

    - name: Import static reference data
      command: php bin/db-import-static.php
      args:
        chdir: "{{ app_root }}"
      when: db_local is defined and (db_local | bool)

    - name: Refresh stored procedures and triggers
      command: php maintain.php
      args:
        chdir: "{{ app_root }}/sql/stored-proc"
      when: db_local is defined and (db_local | bool)
      ignore_errors: true

    - name: Re-run dbsv-update.php (some mutations require triggers)
      command: php bin/dbsv-update.php
      args:
        chdir: "{{ app_root }}"
      when: db_local is defined and (db_local | bool)

    - name: Import static data SQL
      shell: |
        for f in sql/static-data/*.sql; do
          mysql -u{{ db_user }} -p'{{ db_pass }}' {{ db_name }} < "$f" 2>/dev/null || true
        done
      args:
        chdir: "{{ app_root }}"
        executable: /bin/bash
      when: db_local is defined and (db_local | bool)

    - name: Run oc3 Doctrine migrations
      command: php bin/console doctrine:migrations:migrate -n --allow-no-migration
      args:
        chdir: "{{ app_root }}/htdocs"
      when: db_local is defined and (db_local | bool)

    - name: Pre-mark oc4 migration (security_roles already exists from dump)
      shell: |
        mysql -u root -e "INSERT IGNORE INTO {{ db_name }}.oc_migrations (version, executed_at) VALUES ('OcMigrations\\\\Version20201014195236', NOW())" 2>/dev/null || true
      args:
        executable: /bin/bash
      when: db_local is defined and (db_local | bool)

    - name: Run oc4 Symfony Doctrine migrations
      shell: |
        mysql -u root -e "SET GLOBAL foreign_key_checks=0" 2>/dev/null
        php bin/console doctrine:migrations:migrate -n --allow-no-migration
        mysql -u root -e "SET GLOBAL foreign_key_checks=1" 2>/dev/null
      args:
        chdir: "{{ app_root }}/htdocs_symfony"
        executable: /bin/bash
      when: db_local is defined and (db_local | bool)

    - name: Seed Symfony security roles (required by authentication system)
      shell: |
        mysql -u{{ db_user }} -p'{{ db_pass }}' {{ db_name }} <<'EOF'
        INSERT IGNORE INTO security_roles (id, role) VALUES (1,'ROLE_USER'),(2,'ROLE_ADMIN'),(3,'ROLE_SUPER_ADMIN'),(4,'ROLE_MODERATOR');
        EOF
      args:
        executable: /bin/bash
      when: db_local is defined and (db_local | bool)
      ignore_errors: true

    - name: Run OKAPI database update
      command: php bin/okapi-update.php
      args:
        chdir: "{{ app_root }}"
      when: db_local is defined and (db_local | bool)

    - name: Clear and regenerate application caches (menu, labels, templates)
      command: php bin/clear-webcache.php
      args:
        chdir: "{{ app_root }}"
      when: db_local is defined and (db_local | bool)

    - name: Ensure Smarty cache directories exist with correct permissions
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0777"
      loop:
        - "{{ app_root }}/htdocs/var/cache2/smarty/cache"
        - "{{ app_root }}/htdocs/var/cache2/smarty/compiled"

    - name: Set cache/log dirs writable
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0777"
        recurse: true
      loop:
        - "{{ app_root }}/htdocs/var"
        - "{{ app_root }}/htdocs_symfony/var"

    - name: Warm up Symfony cache
      command: php bin/console cache:clear
      args:
        chdir: "{{ app_root }}/htdocs_symfony"
      ignore_errors: true

    - name: Ensure var/log directory exists (required for Symfony logging)
      file:
        path: "{{ app_root }}/htdocs_symfony/var/log"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0775"

    # ── Phase 8: Cron Jobs ─────────────────────────────────────────────

    - name: Install cron jobs
      cron:
        name: "{{ item.name }}"
        job: "{{ item.job }}"
        minute: "{{ item.minute | default('*/10') }}"
        user: "{{ web_user }}"
        state: present
      loop:
        - name: "oc-legacy-dbmaintain"
          job: "cd {{ app_root }}/htdocs && php bin/dbmaintain.php > /dev/null 2>&1"
          minute: "*/15"

    - name: Install PHP session cleanup cron
      copy:
        content: |
          # Clean up old PHP sessions every 30 minutes
          09,39 * * * * {{ web_user }} [ -x /usr/lib/php/sessionclean ] && /usr/lib/php/sessionclean
        dest: /etc/cron.d/php-sessionclean
        mode: "0644"

    # ── Phase 9: Test Data (optional, from ocde) ─────────────────────────

    - name: Copy test data to VM
      copy:
        src: "{{ test_data_file }}"
        dest: /tmp/test-data.sql.gz
      when: db_local is defined and test_data_file is defined

    - name: Drop triggers before test data import (prevents recursion errors)
      shell: |
        mysql -u{{ db_admin_user }} -p'{{ db_admin_pass }}' {{ db_name }} -N -e "SELECT CONCAT('DROP TRIGGER IF EXISTS \`', TRIGGER_NAME, '\`;') FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='{{ db_name }}'" | mysql -u{{ db_admin_user }} -p'{{ db_admin_pass }}' {{ db_name }}
      args:
        executable: /bin/bash
      when: db_local is defined and test_data_file is defined

    - name: Import test data
      shell: gzip -dc /tmp/test-data.sql.gz | mysql -u{{ db_user }} -p'{{ db_pass }}' {{ db_name }}
      args:
        executable: /bin/bash
      when: db_local is defined and test_data_file is defined

    - name: Recreate triggers after test data import
      command: php maintain.php
      args:
        chdir: "{{ app_root }}/sql/stored-proc"
      when: db_local is defined and test_data_file is defined
      ignore_errors: true

    - name: Ensure cache_desc has desc_dark_unsafe column
      shell: mysql -uroot oc -e "ALTER TABLE cache_desc ADD COLUMN desc_dark_unsafe TINYINT(1) NOT NULL DEFAULT 0 AFTER short_desc" 2>/dev/null; true
      when: db_local is defined and test_data_file is defined

    - name: Create user_roles table if missing (needed by ocde test data)
      shell: mysql -uroot oc -e "CREATE TABLE IF NOT EXISTS user_roles (id INT AUTO_INCREMENT PRIMARY KEY, user_id INT NOT NULL, role_id INT NOT NULL)" 2>/dev/null; true
      when: db_local is defined and test_data_file is defined

    - name: Add descriptions to all caches (required for complete test data)
      shell: |
        mysql -uroot oc <<'SQL'
        CREATE TEMPORARY TABLE _missing_desc AS
        SELECT c.cache_id, c.node, SUBSTRING_INDEX(c.desc_languages, ',', 1) AS lang
        FROM caches c LEFT JOIN cache_desc cd ON c.cache_id = cd.cache_id WHERE cd.cache_id IS NULL;
        INSERT IGNORE INTO cache_desc (uuid, node, date_created, last_modified, cache_id, language, `desc`, desc_html, desc_htmledit, hint, short_desc, desc_dark_unsafe)
        SELECT UUID(), m.node, NOW(), NOW(), m.cache_id, m.lang,
        '<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p><p>Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p><p>Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.</p>',
        1, 1, '', 'Lorem ipsum dolor sit amet (placeholder description)', 0
        FROM _missing_desc m;
        DROP TEMPORARY TABLE _missing_desc;
        SQL
      when: db_local is defined and test_data_file is defined

    - name: Set all test user passwords to non-trivial value
      shell: mysql -uroot oc -e "UPDATE user SET password='5c2cec3234746f7138fde0c9c2ae863b' WHERE user_id != 1"
      when: db_local is defined and test_data_file is defined

    - name: Clear page cache after data load (avoid stale error pages)
      file:
        path: "{{ app_root }}/htdocs/var/cache2/smarty/cache"
        state: "{{ item }}"
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0777"
      loop:
        - absent
        - directory
      when: db_local is defined and test_data_file is defined

    # ── Final Reload ───────────────────────────────────────────────────

    - name: Reload Apache
      systemd:
        name: apache2
        state: reloaded

  handlers:
    - name: reload apache
      systemd:
        name: apache2
        state: reloaded

    - name: restart apache2
      systemd:
        name: apache2
        state: restarted

    - name: reload php-fpm
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - php8.2-fpm
        - php8.4-fpm

    - name: restart php8.2-fpm
      systemd:
        name: php8.2-fpm
        state: restarted

    - name: restart php8.4-fpm
      systemd:
        name: php8.4-fpm
        state: restarted

    - name: restart mariadb
      systemd:
        name: mariadb
        state: restarted
